spring.application.name=Pern-Merch-Website
# Server
server.port=8080

# Load local env vars from backend/.env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# change to update to keep tables after runs
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

admin.secret.username=${ADMIN_USERNAME}
admin.secret.password=${ADMIN_PASSWORD}

# Profile is env-driven so production can override (defaults to dev for local work)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Resource tuning for low-memory container (Lightsail Nano: 512 MB / 0.25 vCPU)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
