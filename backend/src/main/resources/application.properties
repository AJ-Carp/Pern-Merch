spring.application.name=Pern-Merch-Website
# Server
server.port=8080

# Load local env vars from backend/.env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# change to update to keep tables after runs
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

admin.secret.username=${ADMIN_USERNAME}
admin.secret.password=${ADMIN_PASSWORD}

# Profile is env-driven so production can override (defaults to dev for local work)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Abandoned-order sweeper disabled by default to stay on the Neon free tier
# Set to true to re-enable cleanup of stale PENDING_PAYMENT orders/PaymentIntents.
checkout.sweeper-enabled=${CHECKOUT_SWEEPER_ENABLED:false}

# Mail (provider-agnostic SMTP). Enable by setting SPRING_MAIL_HOST / SPRING_MAIL_USERNAME /
# SPRING_MAIL_PASSWORD (and optionally SPRING_MAIL_PORT) via env — works with SES/SendGrid/
# Postmark/Gmail SMTP. Left unset = mail disabled and sends are skipped (safe for local dev).
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Address order emails are sent FROM, and the merchant address that receives new-order alerts.
app.mail.from=${MAIL_FROM:}
app.mail.merchant=${MERCHANT_NOTIFICATION_EMAIL:}

# Resource tuning for low-memory container (Lightsail Nano: 512 MB / 0.25 vCPU)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
spring.datasource.hikari.maximum-pool-size=5
# 0 so the pool drains fully — HikariCP's 2 min keepalive pings otherwise keep
# Neon's free-tier compute from ever auto-suspending.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
